<!DOCTYPE html>
<!-- Página de cadastro, consulta, edição, exclusão e filtragem de produtos. -->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de produtos</title>
    <link rel="stylesheet" href="../styles/produtos.css">
</head>

<body>
    <aside class="menu">
        <h2>ESTOQUE FÁCIL</h2>
        <nav>
            <a href="/src/pages/index.html">Dashboard</a>
            <a href="/src/pages/produtos.html" class="ativo">Produtos</a>
            <a href="/src/pages/categorias.html">Categorias</a>
        </nav>
        <hr class="divisor-menu">
    </aside>

    <main class="painel-produtos">
        <section class="tabela-box tabela-produtos">
            <div class="tabela-cabecalho">
                <div class="titulo-busca-produtos">
                    <h1>Tabela de Produtos</h1>
                    <div class="campo-busca-produtos">
                        <input id="buscaProduto" type="text" placeholder="Buscar produto">
                        <button class="botao-principal" id="botaoBuscarProduto" type="button">Buscar</button>
                    </div>
                </div>
                <button class="botao-cadastrar-produto" id="abrirModalProduto" type="button">
                    Cadastrar produto
                </button>
            </div>

            <div class="tabela-wrap">
                <table class="tabela-produtos-visual">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Qtd. mínima</th>
                            <th>Status</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="produtos-tbody">
                        <tr>
                            <td colspan="8">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <aside class="painel-filtro-lateral">
            <h3>Filtrar produtos</h3>

            <div class="campo-filtro-produto">
                <label for="filtroCategoriaProduto">Categoria</label>
                <select id="filtroCategoriaProduto">
                    <option value="">Selecione aqui</option>
                </select>
            </div>

            <div class="campo-filtro-produto">
                <label for="filtroStatusProduto">Status</label>
                <select id="filtroStatusProduto">
                    <option value="">Selecione aqui</option>
                    <option value="critico">Crítico</option>
                    <option value="normal">Normal</option>
                </select>
            </div>

            <div class="acoes-filtro-lateral">
                <button class="botao-principal" id="filtrarProdutos" type="button">Filtrar</button>
                <button class="botao-secundario" id="limparFiltroProduto" type="button">Limpar</button>
            </div>
        </aside>
    </main>

    <div class="modal-produto" id="modalProduto" hidden>
        <section class="modal-produto-conteudo" role="dialog" aria-modal="true" aria-labelledby="tituloModalProduto">
            <header class="modal-produto-cabecalho">
                <h2 id="tituloModalProduto">Cadastrar produto</h2>
                <button class="botao-fechar-modal" id="fecharModalProduto" type="button"
                    aria-label="Fechar modal">×</button>
            </header>

            <form id="formProduto">
                <div class="campo-formulario">
                    <label for="nomeProduto">Nome do produto</label>
                    <input id="nomeProduto" type="text" required>
                </div>

                <div class="campo-formulario">
                    <label for="categoriaProduto">Categoria</label>
                    <select id="categoriaProduto" required>
                        <option value="">Selecione uma categoria</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="quantidadeProduto">Quantidade</label>
                    <input id="quantidadeProduto" type="number" min="0" required>
                </div>

                <div class="campo-formulario">
                    <label for="quantidadeMinimaProduto">Quantidade mínima</label>
                    <input id="quantidadeMinimaProduto" type="number" min="0" required>
                </div>

                <div class="campo-formulario">
                    <label for="precoProduto">Preço</label>
                    <input id="precoProduto" type="number" min="0" step="0.01" required>
                </div>

                <div class="acoes-modal">
                    <button class="botao-principal" type="submit">Salvar produto</button>
                </div>
            </form>
        </section>
    </div>

    <div class="modal-produto" id="modalEditarProduto" hidden>
        <section class="modal-produto-conteudo" role="dialog" aria-modal="true"
            aria-labelledby="tituloModalEditarProduto">
            <header class="modal-produto-cabecalho">
                <h2 id="tituloModalEditarProduto">Editar produto</h2>
                <button class="botao-fechar-modal" id="fecharModalEditarProduto" type="button"
                    aria-label="Fechar modal">×</button>
            </header>

            <form id="formEditarProduto">
                <input type="hidden" id="idProdutoEdicao">

                <div class="campo-formulario">
                    <label for="nomeProdutoEdicao">Nome do produto</label>
                    <input id="nomeProdutoEdicao" type="text" required>
                </div>

                <div class="campo-formulario">
                    <label for="categoriaProdutoEdicao">Categoria</label>
                    <select id="categoriaProdutoEdicao" required>
                        <option value="">Selecione uma categoria</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="quantidadeProdutoEdicao">Quantidade</label>
                    <input id="quantidadeProdutoEdicao" type="number" min="0" required>
                </div>

                <div class="campo-formulario">
                    <label for="quantidadeMinimaProdutoEdicao">Quantidade mínima</label>
                    <input id="quantidadeMinimaProdutoEdicao" type="number" min="0" required>
                </div>

                <div class="campo-formulario">
                    <label for="precoProdutoEdicao">Preço</label>
                    <input id="precoProdutoEdicao" type="number" min="0" step="0.01" required>
                </div>

                <div class="acoes-modal">
                    <button class="botao-secundario" id="cancelarModalEditarProduto" type="button">Cancelar</button>
                    <button class="botao-principal" type="submit">Salvar alterações</button>
                </div>
            </form>
        </section>
    </div>

    <script src="../scripts/page_produtos/produtos.js"></script>
</body>

</html>
