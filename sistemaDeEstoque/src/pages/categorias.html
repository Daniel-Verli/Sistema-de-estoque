<!DOCTYPE html>
<!-- Página de gerenciamento, busca e organização das categorias. -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Controle de categorias </title>
    <link rel="stylesheet" href="../styles/categorias.css">
</head>
<body>

<aside class="menu">
    <h2>ESTOQUE FÁCIL</h2>

    <nav>
        <a href="/src/pages/index.html">Dashboard</a>
        <a href="produtos.html" >Produtos</a>
        <a href="categorias.html"  class="ativo">Categorias</a>
    </nav>
    <hr class="divisor-menu">
</aside>

<main class="painel-produtos">

    <section class="tabela-box tabela-produtos">

        <div class="tabela-cabecalho">
            <div>
                <h1>Tabela de Categorias</h1>

                <div class="acoes-categorias">
                    <input
                    type="text"
                    id="buscarCategoriaInput"
                    class="campoCategoria"
                    placeholder="Digite o nome da categoria"
                    aria-label="Nome da categoria"
                    >
                </div>
            </div>
        </div>


        <div class="tabela-wrap" id="tabelaCategorias">
            <table class="tabela-produtos-visual">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome categoria</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="categorias-tbody">


                </tbody>
            </table>
        </div>

        <div class="acoes-categorias">
            <input
                type="text"
                id="novaCategoriaInput"
                class="campoCategoria"
                placeholder="Digite o nome da categoria"
                aria-label="Nome da categoria"
            >
            <button class="botaoInserirCategoria" type="button">Adicionar categoria</button>
        </div>

    </section>
</main>

<script type="module" src="../scripts/page_categorias/categoria.js"></script>
</body>
</html>
